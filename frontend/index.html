<body>
  <div class="app-shell">
    <main class="main-content">

        <div class="brand">
          <div class="brand-mark">hf</div>
          <div><strong>Healthy Foods</strong><span>your daily food guide</span></div>
        </div>
        <div class="sidebar-section profile-summary" id="profileSummary">

        </div>
      </div>

        <div class="status"><span class="status-dot"></span> พร้อมให้คำแนะนำ</div>
      </header>

      <section class="chat-layout">
        <div class="chat-panel">
          <div class="chat-header"><div class="bot-avatar">✦</div><div><strong>Healthy Foods Bot</strong><span>ผู้ช่วยแนะนำอาหารเพื่อสุขภาพ</span></div><button class="icon-button" id="resetButton" title="เริ่มต้นใหม่">↻</button></div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-composer" id="composer"></div>
        </div>

          <p class="insight-copy">ตอบคำถามสั้น ๆ แล้วเราจะช่วยจัดมื้ออาหารที่เข้ากับเป้าหมายและไลฟ์สไตล์ของคุณ</p>

        </aside> -->

    </main>
